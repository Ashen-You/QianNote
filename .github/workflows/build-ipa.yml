name: Build unsigned IPA

# 推送代码或手动点按钮都会触发；在 macOS 云端机器上编译，产出未签名 .ipa
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    # Liquid Glass（Glass / .glassEffect）需要 iOS 26 SDK 编译，
    # macos-15 自带的 Xcode 16.x 只有 iOS 18 SDK，会报 cannot find type 'Glass'。
    # macos-26 默认 Xcode 26.6（iOS 26.5 SDK），能编译；运行时仍靠 #available 降级到 iOS 17。
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Build archive (no code signing)
        run: |
          xcodebuild archive \
            -project QianNote.xcodeproj \
            -scheme QianNote \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/QianNote.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_BITCODE=NO \
            ONLY_ACTIVE_ARCH=NO

      - name: Package Payload into IPA
        run: |
          APP="build/QianNote.xcarchive/Products/Applications/QianNote.app"
          test -d "$APP" || { echo "找不到 QianNote.app，归档失败"; exit 1; }
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          cd build
          zip -qry QianNote-unsigned.ipa Payload
          ls -lh QianNote-unsigned.ipa
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" QianNote.xcarchive/Products/Applications/QianNote.app/Info.plist || true

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: QianNote-unsigned-ipa
          path: build/QianNote-unsigned.ipa
          if-no-files-found: error
